$schema: "https://json-schema.org/draft/2020-12/schema"
title: Universal Backlog Item
type: object
additionalProperties: false
required:
  - id
  - project_id
  - title
  - description
  - type
  - status
  - priority
  - owner
  - estimate
  - dates
  - acceptance_criteria
  - definition_of_done
  - success_metrics
  - dependencies
  - risks
  - open_questions
  - custom_fields
properties:
  id:
    type: string
    minLength: 1
  project_id:
    type: string
    minLength: 1
    description: Required stable project identifier for safe multi-project backlog management.
  title:
    type: string
    minLength: 1
  description:
    type: string
  type:
    type: string
    enum:
      - epic
      - feature
      - story
      - task
      - bug
      - research
      - milestone
  status:
    type: string
    enum:
      - new
      - ready
      - in_progress
      - blocked
      - done
      - canceled
  priority:
    type: string
    enum:
      - critical
      - high
      - medium
      - low
  owner:
    type: string
  estimate:
    type: object
    additionalProperties: false
    required:
      - value
      - unit
    properties:
      value:
        type:
          - number
          - string
          - "null"
      unit:
        type: string
        enum:
          - points
          - days
          - hours
          - tbd
  dates:
    type: object
    additionalProperties: false
    properties:
      created:
        type:
          - string
          - "null"
      updated:
        type:
          - string
          - "null"
      start:
        type:
          - string
          - "null"
      due:
        type:
          - string
          - "null"
      quarter:
        type:
          - string
          - "null"
        pattern: "^$|^20[0-9]{2}-Q[1-4]$"
  acceptance_criteria:
    type: array
    items:
      type: string
  definition_of_done:
    type: array
    items:
      type: string
  success_metrics:
    type: array
    items:
      type: string
  dependencies:
    type: array
    items:
      type: string
  risks:
    type: array
    items:
      type: string
  open_questions:
    type: array
    items:
      type: string
  custom_fields:
    type: object
    description: Project-specific fields such as alumni_applicable, pgk_required, source_quarter, artifacts, comments.
